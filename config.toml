baseURL = "https://pulseoflifekindergarten.com/"
languageCode = "en-us"
title = "Pulse Of Life Kindergarten"
theme = "PaperMod"

# Output formats
outputs = { home = ["HTML", "JSON"] }

# Pagination
[pagination]
  pagerSize = 10

# Markup settings
[markup]
  [markup.goldmark.renderer]
    unsafe = true

# Menu items
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  name = "Our Community"
  url = "/community/"
  weight = 20

[[menu.main]]
  name = "Our Montessori Approach"
  url = "/montessori/"
  weight = 30

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 40

[[menu.main]]
  name = "Donate"
  url = "/donate/"
  weight = 50

# Site parameters
[params]
  env = "production"
  title = "Pulse Of Life Kindergarten"
  description = "Quality education for Syrian children affected by displacement. Providing inclusive, Montessori-based education in Dara'a, Syria."
  keywords = ["kindergarten", "pulse of life", "education", "Syria", "displaced children", "Montessori"]
  author = "Pulse Of Life Kindergarten"

  # Theme settings
  defaultTheme = "auto"
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = false
  TocOpen = false
  ShowShareButtons = false

  # CharityStack donation platform (script tag is loaded in layouts/partials/charitystack.html)
  #   hostedURL      -> CharityStack hosted donation page. Used by every Donate button today.
  #   formID         -> once CharityStack authorizes pulseoflifekindergarten.org for the overlay,
  #                     set this to the form ID and every Donate button opens the in-page overlay instead.
  #   embedElementID -> optional: element ID (E_xxxxxxxx) to embed a form inline on /donate/.
  [params.charitystack]
    hostedURL = "https://charitystack.com/donate/7435cf84-4dc5-491e-9c89-0ac41ab52739"
    formID = ""
    embedElementID = ""

  # Social media (optional)
  [params.social]
    email = "pulseoflifekindergarten@gmail.com"
    github = ""
    linkedin = ""
    twitter = ""
